name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Dockerfile scaffolder pin
        run: |
          node scripts/check-docker-pin.mjs
          node --test scripts/check-docker-pin.test.mjs
      - name: Check README matches service.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          app = json.loads(Path("service.json").read_text(encoding="utf-8"))["appName"]

          assert f"registers the resource as `{app}`" in readme, "README must mention the service.json resource name"
          assert "## Use it in a Flisk project" in readme, "README must have the 'Use it in a Flisk project' section"
          section = readme.split("## Use it in a Flisk project", 1)[1].split("\n## ", 1)[0]
          assert "flisk up" in section, "the 'Use it in a Flisk project' section must show flisk up for the shipped service.json"
          assert f"flisk resource {app} --type bring-your-own" not in section, "README must not re-register the service.json resource name"
          assert f"flisk resource {app}-copy --type bring-your-own" in section, "README must show a second-copy example with a different name"
          print("README register section is consistent with service.json")
          PY
      - name: Check service.json web UI routing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          svc = json.loads(Path("service.json").read_text(encoding="utf-8"))
          readme = Path("README.md").read_text(encoding="utf-8")
          assert svc.get("webUi") is True, "service.json must set webUi: true for browser UIs"
          assert "flisk status" in readme, "README must mention the flisk status URL"
          assert f"/api/{svc['appName']}" in readme, "README must mention the path-prefix URL is not used"
          print("service.json and README agree on web UI routing")
          PY
      - name: Build the image
        run: docker build -t template .
      - name: Run it and expect HTTP 200 on the health path
        run: |
          HEALTH_PATH=$(python3 -c 'import json;print(json.load(open("service.json"))["healthCheckPath"])')
          docker run -d --name template -e PORT=4000 -p 4000:4000 template
          code=000
          html=0
          for _ in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.html -w '%{http_code}' "http://127.0.0.1:4000$HEALTH_PATH" || true)
            html=$(grep -ci '<html' /tmp/health.html || true)
            if [ "$code" = "200" ] && [ "$html" -gt 0 ]; then echo "HTTP 200 with HTML on $HEALTH_PATH"; exit 0; fi
            sleep 2
          done
          echo "last status: $code, html markers: $html"; docker logs template; exit 1
      - name: Clean up
        if: always()
        run: docker rm -f template || true
