name: e2e
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    # Runs this template through a real `flisk up` and Traefik (flisk-sh/flisk#1965). Bump both SHAs together.
    uses: flisk-sh/flisk/.github/workflows/byo-template-e2e.yml@f32efca7888b06681dd15e1d72200454f745b935
    with:
      flisk-ref: f32efca7888b06681dd15e1d72200454f745b935
